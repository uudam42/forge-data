[project]
name = "forge-data"
dynamic = ["version"]
description = "Local-first robotics / physical AI / multimodal sensor data pipeline platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
forge = "app.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "build>=1.2",
]
# Parquet export (Step 9) is optional — the base install works fully
# without it; requesting a "parquet" export without this extra returns a
# clear 400 UNSUPPORTED_EXPORT_FORMAT instead of crashing.
parquet = [
    "pyarrow>=15",
]

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "load: large-data load/scale tests (deselected by default; run explicitly with `pytest -m load`)",
    "concurrency: real multiprocess concurrency tests, v2.4 (deselected by default; run explicitly with `pytest -m concurrency`)",
]
# Plain `pytest` skips load and concurrency tests so normal development
# stays fast; `pytest -m load` / `pytest -m concurrency` on the command
# line overrides this (pytest's -m is last-wins, not combined) and runs
# only that marker's tests.
addopts = "-m 'not load and not concurrency'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.resources" = ["schemas/*.json"]
"app.web" = ["dist/**/*"]
